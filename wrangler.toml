name = "ludo-arena-multiplayer"
main = "worker/index.ts"
compatibility_date = "2026-11-06"

[[durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

[[d1_databases]]
binding = "DB"
database_name = "ludo-arena-prod-db"
database_id = "8648a531-4c3a-4b4e-b6d1-44cce651b94b"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VoiceBudget"]

[[ratelimits]]
name = "CREATE_ROOM_LIMITER"
namespace_id = "7415023861"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "JOIN_ROOM_LIMITER"
namespace_id = "7415023862"
simple = { limit = 10, period = 60 }

# Preview deployments receive isolated Durable Object storage. Omitting the
# production rate-limit bindings keeps preview actions separate from production.
[previews.durable_objects]
[[previews.durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[previews.durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

[dev]
ip = "0.0.0.0"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# Staging environment for testing before production
[env.staging]
name = "ludo-arena-multiplayer-staging"

[env.staging.vars]
ACCOUNTS_ENABLED = "true"
CHAT_ENABLED = "true"
VOICE_ENABLED = "true"

[[env.staging.durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[env.staging.durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ludo-arena-staging-db"
database_id = "340e940d-747c-469b-8e49-579956d99da9"

# Production environment
[env.production]
name = "ludo-arena-multiplayer-production"

[env.production.vars]
ACCOUNTS_ENABLED = "true"
CHAT_ENABLED = "true"
VOICE_ENABLED = "true"

[[env.production.durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[env.production.durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ludo-arena-prod-db"
database_id = "8648a531-4c3a-4b4e-b6d1-44cce651b94b"
