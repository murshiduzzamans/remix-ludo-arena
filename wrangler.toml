name = "ludo-arena-multiplayer"
main = "worker/index.ts"
compatibility_date = "2026-11-06"

[[durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom"]

[[ratelimits]]
name = "CREATE_ROOM_LIMITER"
namespace_id = "7415023861"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "JOIN_ROOM_LIMITER"
namespace_id = "7415023862"
simple = { limit = 10, period = 60 }

[dev]
ip = "0.0.0.0"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
