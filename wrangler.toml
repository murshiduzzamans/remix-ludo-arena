name = "ludo-arena-multiplayer"
main = "worker/index.ts"
compatibility_date = "2026-11-06"

[[durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

# D1 database binding will be added after manual database creation
# Uncomment and fill in database_id after running: wrangler d1 create ludo-arena-prod-db
# [[d1_databases]]
# binding = "DB"
# database_name = "ludo-arena-prod-db"
# database_id = "YOUR_PROD_DATABASE_ID"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VoiceBudget"]

[[ratelimits]]
name = "CREATE_ROOM_LIMITER"
namespace_id = "7415023861"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "JOIN_ROOM_LIMITER"
namespace_id = "7415023862"
simple = { limit = 10, period = 60 }

# Preview deployments receive isolated Durable Object storage. Omitting the
# production rate-limit bindings keeps preview actions separate from production.
[previews.durable_objects]
[[previews.durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[previews.durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

[dev]
ip = "0.0.0.0"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# Staging environment for testing before production
[env.staging]
name = "ludo-arena-multiplayer-staging"

[[env.staging.durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[env.staging.durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

# Staging D1 database - fill in after: wrangler d1 create ludo-arena-staging-db
# [[env.staging.d1_databases]]
# binding = "DB"
# database_name = "ludo-arena-staging-db"
# database_id = "YOUR_STAGING_DATABASE_ID"

# Production environment
[env.production]
name = "ludo-arena-multiplayer-production"

[[env.production.durable_objects.bindings]]
name = "LUDO_ROOMS"
class_name = "LudoRoom"

[[env.production.durable_objects.bindings]]
name = "VOICE_BUDGET"
class_name = "VoiceBudget"

# Production D1 database - fill in after: wrangler d1 create ludo-arena-prod-db
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "ludo-arena-prod-db"
# database_id = "YOUR_PROD_DATABASE_ID"
